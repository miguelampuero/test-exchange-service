spring:
  application:
    name: test-exchange-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          exchangeRateApi:
            connect-timeout: 3000
            read-timeout: 5000
            logger-level: basic

exchange-rate:
  api:
    base-url: https://v6.exchangerate-api.com/v6
    # Se puede sobreescribir con la variable de entorno EXCHANGE_RATE_API_KEY
    key: ${EXCHANGE_RATE_API_KEY:3635bb7bf1393d87c4dd5155}

logging:
  level:
    pe.test.exchange: INFO
    pe.test.exchange.infrastructure.external.ExchangeRateApiClient: DEBUG

#Abre http://localhost:8080/h2-console
